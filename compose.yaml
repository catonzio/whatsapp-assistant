services:
  wa-ass:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-assistant:0.1
    container_name: wa-ass
    ports:
      - "1000:8000"
    env_file:
      - secrets/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp-assistant.rule=PathPrefix(`/whatsapp-assistant`)"
      - "traefik.http.routers.whatsapp-assistant.tls=true"
      - "traefik.http.routers.whatsapp-assistant.entrypoints=web,websecure"
      - "traefik.http.routers.whatsapp-assistant.middlewares=whatsapp-assistant-strip"
      - "traefik.http.middlewares.whatsapp-assistant-strip.stripprefix.prefixes=/whatsapp-assistant"
      - "traefik.http.services.whatsapp-assistant.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-network"

  db:
    image: postgres:17-alpine
    container_name: wa-ass-db
    env_file:
      - secrets/.env
    # Bound to loopback only: convenient for local psql/alembic during
    # development, still unreachable from outside the host.
    ports:
      - "5435:5432"
    volumes:
      - wa-ass-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Not on traefik-network: only reachable by wa-ass on the internal network,
    # never exposed to the public internet.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-wa_ass} -d ${DATABASE_DB:-whatsapp_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  traefik-network:
    external: true
  internal:

volumes:
  wa-ass-db-data:
