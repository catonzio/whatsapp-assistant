repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (fix + import sort)
        entry: uv run ruff check --extend-select I --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
