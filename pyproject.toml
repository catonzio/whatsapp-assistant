[project]
name = "whatsapp-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danilo Catone", email = "danilo.catone@tinextainnovationhub.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.139.0",
    "google-adk>=1.27.2",
    "google-genai>=1.51.0",
    "greenlet>=3.1.1",
    "httpx2>=2.6.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
whatsapp-assistant = "whatsapp_assistant.main:main"
whatsapp-assistant-cli = "whatsapp_assistant.interfaces.cli:run_cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Both raised by third-party libs on Python 3.14 (google-genai/google-adk
    # haven't updated for it yet), not by our code — scoped to the exact
    # message so any other DeprecationWarning still surfaces normally.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\\.genai",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/whatsapp_assistant"]
omit = [
    "src/whatsapp_assistant/interfaces/cli.py",  # interactive loop, exercised manually
    "src/whatsapp_assistant/agents/placeholder_agent.py",  # temporary, see docs/architecture.md §7
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]
