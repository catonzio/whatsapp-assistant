[project]
name = "whatsapp-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danilo Catone", email = "danilo.catone@tinextainnovationhub.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "httpx2>=2.6.0",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
whatsapp-assistant = "whatsapp_assistant.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]
